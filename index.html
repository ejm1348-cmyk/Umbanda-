<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbanda en Argentina | Casa AZHAS - Villa Ballester</title>
  <style>
    :root {
      --bg: #08090b;
      --surface: #111419;
      --surface-hover: #171b22;
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.28);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 22px;
    }

    /* Barra superior estilo glassmorphism */
    header {
      background: rgba(8, 9, 11, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    /* Botones modernos */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #04130d;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 13px 24px;
      border-radius: 999px;
      transition: transform 0.18s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 0 24px var(--primary-glow);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #34d399;
      box-shadow: 0 0 32px rgba(16, 185, 129, 0.45);
    }

    .btn-accent {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #0b0904;
      box-shadow: 0 0 26px var(--accent-glow);
    }

    .btn-accent:hover {
      background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
      box-shadow: 0 0 34px rgba(245, 158, 11, 0.45);
    }

    .btn-outline {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      padding: 13px 24px;
      border-radius: 999px;
      font-weight: 700;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Hero oscuro con luz ambiental */
    .hero {
      position: relative;
      padding: 84px 0 76px;
      background:
        radial-gradient(circle at 18% 20%, rgba(16, 185, 129, 0.14), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.12), transparent 45%),
        var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 7px 16px;
      border-radius: 999px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5.5vw, 4rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      max-width: 820px;
      color: #ffffff;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #34d399, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
